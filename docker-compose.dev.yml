version: '3.8'

# Development configuration - DO NOT use in production!
# This configuration includes hot-reloading and debug features

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: bsmarker
      POSTGRES_PASSWORD: bsmarker_dev
      POSTGRES_DB: bsmarker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5433:5432  # Exposed for debugging on different port
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bsmarker]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379  # Exposed for debugging on different port
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000  # API
      - 9001:9001  # Console
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bsmarker:bsmarker_dev@postgres:5432/bsmarker_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: bsmarker
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app  # Hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bsmarker:bsmarker_dev@postgres:5432/bsmarker_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: bsmarker
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app  # Hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=debug

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bsmarker:bsmarker_dev@postgres:5432/bsmarker_db
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app  # Hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app beat --loglevel=debug

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      REACT_APP_API_URL: ${API_URL:-http://localhost/api/v1}
      REACT_APP_MINIO_URL: ${SITE_URL:-http://localhost}
      VITE_API_BASE_URL: ${API_URL:-http://localhost/api}
      VITE_ML_SERVICE_URL: ${API_URL:-http://localhost/api/ml}
      WDS_SOCKET_URL: ${WDS_SOCKET_URL:-ws://localhost/ws}
      DANGEROUSLY_DISABLE_HOST_CHECK: true  # Allow any host (dev mode only)
      WATCHPACK_POLLING: true  # Enable file watching in Docker
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
    depends_on:
      - backend
    command: npm start

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
