[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is opt-in (CI passes --cov=app itself).
addopts =
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    audio: Tests that decode real audio files with librosa
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:pkg_resources is deprecated:UserWarning
    # Expected when tests feed undecodable bytes to librosa (soundfile -> audioread fallback)
    ignore:PySoundFile failed:UserWarning
    ignore:librosa.core.audio.__audioread_load:FutureWarning
